<!doctype html>
<html lang="en" data-design="blueprint">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Custom cursors are otherwise fetched lazily on first hover, briefly
         exposing the fallback cursor. Warm both assets before React mounts. -->
    <link rel="preload" href="/cursors/macos-pan-24.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="/cursors/macos-grabbing-24.png" as="image" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FieldPilot — open-source construction field management. Plans, pins, tasks." />
    <title>FieldPilot</title>
    <script>
      try {
        var d = localStorage.getItem('fp:design');
        if (d) document.documentElement.dataset.design = d;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
